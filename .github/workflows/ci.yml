name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.89.0"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32v1-none
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2
      - name: Build contracts (wasm)
        run: cargo build --workspace --target wasm32v1-none --release --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Fuzz invariants
        run: FUZZ_SEEDS=100 cargo test --release --locked -p belugaswap-pool --test test_tick_engine -- --ignored
